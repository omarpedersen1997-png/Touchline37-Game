name: Touchline Unity Android TEST

on:
  push:
    branches: [codex/unity-66-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchline-unity-android-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_PROJECT: unity/TouchlineUnity
  TOUCHLINE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  TOUCHLINE_BUILD_NUMBER: ${{ github.run_number }}
  TOUCHLINE_COMMIT: ${{ github.sha }}

jobs:
  android-gameci:
    name: Android APK · GameCI
    if: github.repository == 'omarpedersen1997-png/Touchline37-Game' && github.ref == 'refs/heads/codex/unity-66-foundation' && vars.UNITY_BUILD_RUNNER != 'windows-personal'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Hent kun den valgte Unity-commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Brug eksisterende eller opret midlertidig debug-signering
        id: signing
        shell: pwsh
        env:
          UNITY_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: ./unity/ci/New-DebugSigning.ps1 -ExportForGameCi

      - name: Kontrollér Unity-licens
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Den nødvendige repository Secret mangler: $name"
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            echo '::error::Unity-licens mangler. Se unity/CI-ANDROID.md. Personal kan alternativt bruge UNITY_BUILD_RUNNER=windows-personal.'
            exit 1
          fi

      - name: Byg separat ARM64 Android-test-APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/TouchlineUnity
          unityVersion: 6000.6.10f1
          # This exact editor exists in image series 4, not the default series 3.
          customImage: unityci/editor:ubuntu-6000.6.10f1-android-4.0.0@sha256:a3688acf991cb13574b9f4508a57281a2b349f7dced124ec7cb6a2157f522673
          dockerShmSize: 2g
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Touchline.Editor.TouchlineCiBuild.BuildAndroid
          versioning: None
          androidTargetSdkVersion: 35
          androidKeystoreName: touchline-ci-debug.keystore
          androidKeystoreBase64: ${{ steps.signing.outputs.keystore_base64 }}
          customParameters: >-
            -touchlineBranch ${{ github.ref }}
            -touchlineBuildId ${{ env.TOUCHLINE_BUILD_ID }}
            -touchlineBuildNumber ${{ github.run_number }}
            -touchlineCommit ${{ github.sha }}
            -touchlineSigningKind ${{ steps.signing.outputs.signing_kind }}
            -touchlineKeystore touchline-ci-debug.keystore

      - name: Verificér APK, app-id, signatur og checksum
        shell: pwsh
        run: ./unity/ci/Publish-AndroidArtifact.ps1

      - name: Downloadbar Android-test-APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Touchline-Unity-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/touchline-unity-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Fjern kun CI-kopi af den hemmelige testnøgle
        if: always()
        shell: pwsh
        run: |
          $key = Join-Path $env:GITHUB_WORKSPACE 'unity/TouchlineUnity/touchline-ci-debug.keystore'
          if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          $temporary = Join-Path $env:RUNNER_TEMP ('touchline-unity-' + $env:TOUCHLINE_BUILD_ID + '.keystore')
          if (Test-Path -LiteralPath $temporary) { Remove-Item -LiteralPath $temporary -Force }

  android-personal-windows:
    name: Android APK · Windows Personal
    if: github.repository == 'omarpedersen1997-png/Touchline37-Game' && github.ref == 'refs/heads/codex/unity-66-foundation' && vars.UNITY_BUILD_RUNNER == 'windows-personal'
    runs-on: [self-hosted, Windows, X64, touchline-unity-6000-6]
    timeout-minutes: 90
    steps:
      - name: Hent kun den valgte Unity-commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Keep the local Unity import cache; never clean a user's PC recursively.
          clean: false

      - name: Byg med lokalt Hub-aktiveret Unity Personal
        shell: powershell
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          UNITY_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: ./unity/ci/Build-Windows.ps1

      - name: Verificér APK, app-id, signatur og checksum
        shell: powershell
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
        run: ./unity/ci/Publish-AndroidArtifact.ps1

      - name: Downloadbar Android-test-APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Touchline-Unity-Android-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/touchline-unity-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
