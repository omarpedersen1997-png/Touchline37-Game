apply plugin: 'com.android.application'

// Testserveren for "Touchline TEST". Standard er en adresse, der aldrig kan nås
// (.invalid), indtil ejeren har godkendt en separat testserver:
//   gradle assembleTouchlineTest -PtouchlineTestApi=https://<testserver>
def touchlineTestApi = (project.findProperty('touchlineTestApi') ?: 'https://touchline-test.invalid').toString().trim()
// Kun dette særskilt oprettede testprojekt må bruge Sites-hosting. Ingen anden
// Sites-adresse slipper gennem produktionsspærren; Java-broen kontrollerer også.
def touchlineApprovedTestApi = 'https://touchline37-engine11-test.glowingconch1.chatgpt.site'
def touchlineProductionMarkers = ['chatgpt.site', 'chatgpt-team.site', 'glowingconch1', 'playtouchline.dk']
if (!touchlineTestApi.startsWith('https://') || touchlineTestApi.contains('"') || touchlineTestApi.contains('\\')) {
    throw new GradleException("touchlineTestApi skal være en https-adresse: ${touchlineTestApi}")
}
if (touchlineProductionMarkers.any { touchlineTestApi.toLowerCase().contains(it) } && touchlineTestApi != touchlineApprovedTestApi) {
    throw new GradleException("Testappen må aldrig pege på produktionsserveren: ${touchlineTestApi}")
}

android {
    namespace = "dk.touchline.footballidle"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dk.touchline.footballidle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "1.0.0"
        // Uændret produktionsserver for release, sideload og debug.
        buildConfigField "String", "TOUCHLINE_API", "\"https://touchline-idle-club.glowingconch1.chatgpt.site\""
        buildConfigField "boolean", "TOUCHLINE_TEST_BUILD", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Webindholdet i produktionsvarianterne er uændret. Testvarianten får kun
    // en genereret overlayfil, hvor delings-/supportlinks bliver i testmiljøet.
    sourceSets {
        maybeCreate('touchlineTest').assets.srcDir(rootProject.file('../.dev-data/android-web'))
    }
    def uploadKeyVariables = ["TOUCHLINE_KEYSTORE", "TOUCHLINE_STORE_PASSWORD", "TOUCHLINE_KEY_ALIAS", "TOUCHLINE_KEY_PASSWORD"]
    if (uploadKeyVariables.any { System.getenv(it) } && !uploadKeyVariables.every { System.getenv(it) }) {
        throw new GradleException("Upload signing requires all four TOUCHLINE signing environment variables.")
    }
    signingConfigs {
        // Separat testnøgle. Den ligger lokalt i .dev-data/android (ignoreres af Git)
        // og må aldrig bruges til produktion eller uploades.
        touchlineTest {
            def testKeyFile = rootProject.file('../.dev-data/android/touchline-test.jks')
            def testKeyProps = rootProject.file('../.dev-data/android/touchline-test.properties')
            if (testKeyFile.isFile() && testKeyProps.isFile()) {
                def props = new Properties()
                testKeyProps.withInputStream { props.load(it) }
                storeFile testKeyFile
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias')
                keyPassword props.getProperty('keyPassword')
            }
        }
        upload {
            if (System.getenv("TOUCHLINE_KEYSTORE")) {
                storeFile file(System.getenv("TOUCHLINE_KEYSTORE"))
                storePassword System.getenv("TOUCHLINE_STORE_PASSWORD")
                keyAlias System.getenv("TOUCHLINE_KEY_ALIAS")
                keyPassword System.getenv("TOUCHLINE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("TOUCHLINE_KEYSTORE")) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Direct APK distribution retains the existing certificate for upgrades.
        // The Play bundle keeps its independent owner-controlled upload signing.
        sideload {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
        // Separat testapp "Touchline TEST": eget applicationId, egen testnøgle og egen
        // testserver. Kan installeres ved siden af APK 37 og kontakter aldrig produktionen.
        touchlineTest {
            initWith release
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            signingConfig signingConfigs.touchlineTest
            debuggable false
            matchingFallbacks = ['release']
            buildConfigField "String", "TOUCHLINE_API", "\"${touchlineTestApi}\""
            buildConfigField "boolean", "TOUCHLINE_TEST_BUILD", "true"
        }
    }
}

// Kun den separate testapp opdateres. Produktionsvarianterne beholder kode 37.
androidComponents {
    onVariants(selector().withBuildType("touchlineTest")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(40)
            output.versionName.set("1.0.0-test-recovery1")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// A fresh default key would break updates for installed APK users.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path.startsWith(':app:') && it.name.contains('TouchlineTest') }) {
        if (!android.signingConfigs.touchlineTest.storeFile?.isFile()) {
            throw new GradleException('Testnøglen mangler. Kør "npm run android:test-key" først.')
        }
        if (!rootProject.file('../.dev-data/android-web/public/index.html').isFile()) {
            throw new GradleException('Testwebindhold mangler. Kør "node dev/prepare-test-apk.mjs" efter android:sync.')
        }
    }
    if (graph.allTasks.any { it.path.startsWith(':app:') && it.name.toLowerCase().contains('sideload') }) {
        if (!android.signingConfigs.debug.storeFile.isFile()) {
            throw new GradleException('The existing APK signing store must be restored before building a sideload update.')
        }
    }
}
